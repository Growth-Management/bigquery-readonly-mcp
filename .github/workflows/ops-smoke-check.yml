name: Ops Smoke Check

on:
  issues:
    types: [opened]

concurrency:
  group: ops-smoke-check-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGION: asia-northeast1
  SERVICE: bigquery-readonly-mcp
  EXPECTED_DEFAULT_PROJECT_ID: ice-mp
  EXPECTED_ALLOWED_PROJECT_IDS: ice-mp
  EXPECTED_ALLOWED_DATASET_IDS: ""
  EXPECTED_ALLOWED_USER_EMAILS: sinohara@impress.co.jp
  EXPECTED_SESSION_STORE_BACKEND: firestore
  EXPECTED_FIRESTORE_SESSION_COLLECTION: bigquery_mcp_sessions
  EXPECTED_SESSION_TTL_SECONDS: "3600"

jobs:
  ops-smoke-check:
    if: startsWith(github.event.issue.title, '[bigquery-mcp-ops] smoke check')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check Cloud Run health
        run: |
          set -euo pipefail
          curl -fsS "${{ secrets.BASE_URL }}/health" | tee /tmp/health.json
          jq -e '.status == "ok"' /tmp/health.json

      - name: Check Cloud Run pilot environment
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${REGION}" \
            --format=json > /tmp/cloud-run-service.json

          jq -r '.spec.template.metadata.name // ""' /tmp/cloud-run-service.json | sed 's/^/revision: /' | tee /tmp/cloud-run-revision.txt

          jq -r '
            .spec.template.spec.containers[0].env[]
            | select(.name == "DEFAULT_PROJECT_ID"
              or .name == "ALLOWED_PROJECT_IDS"
              or .name == "ALLOWED_DATASET_IDS"
              or .name == "ALLOWED_USER_EMAILS"
              or .name == "SESSION_STORE_BACKEND"
              or .name == "FIRESTORE_SESSION_COLLECTION"
              or .name == "SESSION_TTL_SECONDS")
            | "\(.name)=\(.value // "")"
          ' /tmp/cloud-run-service.json | sort | tee /tmp/cloud-run-env.txt

          require_env() {
            local key="$1"
            local expected="$2"
            local actual
            actual="$(awk -F= -v key="$key" '$1 == key {print substr($0, length(key) + 2)}' /tmp/cloud-run-env.txt)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Expected ${key}=${expected}, got ${actual}" >&2
              exit 1
            fi
          }

          require_env DEFAULT_PROJECT_ID "${EXPECTED_DEFAULT_PROJECT_ID}"
          require_env ALLOWED_PROJECT_IDS "${EXPECTED_ALLOWED_PROJECT_IDS}"
          require_env ALLOWED_DATASET_IDS "${EXPECTED_ALLOWED_DATASET_IDS}"
          require_env ALLOWED_USER_EMAILS "${EXPECTED_ALLOWED_USER_EMAILS}"
          require_env SESSION_STORE_BACKEND "${EXPECTED_SESSION_STORE_BACKEND}"
          require_env FIRESTORE_SESSION_COLLECTION "${EXPECTED_FIRESTORE_SESSION_COLLECTION}"
          require_env SESSION_TTL_SECONDS "${EXPECTED_SESSION_TTL_SECONDS}"

      - name: Check recent MCP audit logs
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision"
            resource.labels.service_name="bigquery-readonly-mcp"
            jsonPayload.event_type="bigquery_mcp_tool_call"' \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --limit 20 \
            --format=json > /tmp/mcp-audit-logs.json

          jq '.[] | {
            timestamp,
            user_email: .jsonPayload.user_email,
            tool: .jsonPayload.tool,
            project_id: .jsonPayload.project_id,
            success: .jsonPayload.success,
            rejection_reason: .jsonPayload.rejection_reason,
            error: .jsonPayload.error
          }' /tmp/mcp-audit-logs.json | tee /tmp/mcp-audit-summary.json

      - name: Check Firestore session collection visibility
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl -fsS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://firestore.googleapis.com/v1/projects/${{ secrets.GCP_PROJECT_ID }}/databases/(default)/documents/${EXPECTED_FIRESTORE_SESSION_COLLECTION}?pageSize=5" \
            > /tmp/firestore-sessions.json

          jq '{document_count: ((.documents // []) | length), first_document_fields: ((.documents // [])[0].fields // {}) | keys}' /tmp/firestore-sessions.json | tee /tmp/firestore-summary.json

      - name: Write summary
        if: always()
        run: |
          {
            echo "## BigQuery MCP ops smoke check"
            echo
            echo "Issue: #${{ github.event.issue.number }}"
            echo "Service: ${SERVICE}"
            echo "Region: ${REGION}"
            echo "Expected project: ${EXPECTED_ALLOWED_PROJECT_IDS}"
            echo "Expected session backend: ${EXPECTED_SESSION_STORE_BACKEND}"
            echo
            echo "This workflow does not use MCP_SESSION cookies and does not execute BigQuery as a user."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment result on issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Ops smoke check result"
            echo
            echo "Status: **${{ job.status }}**"
            echo "Run: ${RUN_URL}"
            echo
            echo "Safety boundary: this workflow did not use MCP_SESSION and did not execute BigQuery as a user."
            echo
            if [[ -f /tmp/cloud-run-revision.txt ]]; then
              echo "### Cloud Run revision"
              echo '```text'
              cat /tmp/cloud-run-revision.txt
              echo '```'
            fi
            if [[ -f /tmp/cloud-run-env.txt ]]; then
              echo "### Pilot environment"
              echo '```text'
              cat /tmp/cloud-run-env.txt
              echo '```'
            fi
            if [[ -f /tmp/firestore-summary.json ]]; then
              echo "### Firestore session collection"
              echo '```json'
              cat /tmp/firestore-summary.json
              echo '```'
            fi
            if [[ -f /tmp/mcp-audit-summary.json ]]; then
              echo "### Recent MCP audit logs"
              echo '```json'
              head -c 6000 /tmp/mcp-audit-summary.json
              echo
              echo '```'
            fi
          } > /tmp/issue-comment.md

          gh issue comment "${{ github.event.issue.number }}" --body-file /tmp/issue-comment.md
